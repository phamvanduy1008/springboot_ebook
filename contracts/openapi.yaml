openapi: 3.1.0
info:
  title: EPUB API foundation
  version: 0.1.0
  description: Authentication, personal library, catalog discovery, local EPUB ingestion/publication
    and authorized reader delivery. Public reading requires PUBLIC/PUBLISHED and a
    verified READY published version. Cloud deployment is deferred.
servers:
- url: /
paths:
  /api/v1/books/{book}/manifest:
    get:
      operationId: getBookManifest
      summary: Read an authorized immutable manifest, ordered spine and nested TOC
      description: Public requests require the currently published READY version.
        Private access requires the active owner session, including for administrators.
        Hidden/deleted books are checked before conditional responses. No source/raw-text
        storage route exists. HTTP Range is not supported; a Range request receives
        the full 200 response after authorization. No EPUB is reparsed during delivery.
      parameters:
      - name: book
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Authorized content
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: Private responses use private, no-store; public responses
                require revalidation.
            Vary:
              schema:
                type: string
              description: Cookie
            X-Content-Type-Options:
              schema:
                type: string
              description: nosniff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderManifest'
        '304':
          description: Not modified after current authorization is rechecked
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: Private responses use private, no-store; public responses
                require revalidation.
            Vary:
              schema:
                type: string
              description: Cookie
            X-Content-Type-Options:
              schema:
                type: string
              description: nosniff
        '404':
          description: Missing/inaccessible/unpublished book, version or asset
        '503':
          description: Local artifact unavailable or integrity mismatch
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/books/{book}/versions/{version}/manifest:
    get:
      operationId: getVersionManifest
      summary: Read an authorized immutable manifest, ordered spine and nested TOC
      description: Public requests require the currently published READY version.
        Private access requires the active owner session, including for administrators.
        Hidden/deleted books are checked before conditional responses. No source/raw-text
        storage route exists. HTTP Range is not supported; a Range request receives
        the full 200 response after authorization. No EPUB is reparsed during delivery.
      parameters:
      - name: book
        in: path
        required: true
        schema:
