      - name: book
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: version
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Authorized content
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: Private responses use private, no-store; public responses
                require revalidation.
            Vary:
              schema:
                type: string
              description: Cookie
            X-Content-Type-Options:
              schema:
                type: string
              description: nosniff
            Accept-Ranges:
              schema:
                type: string
                enum:
                - none
            Content-Length:
              schema:
                type: integer
                format: int64
          content:
            application/epub+zip:
              schema:
                type: string
                format: binary
        '304':
          description: Not modified after current authorization is rechecked
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: Private responses use private, no-store; public responses
                require revalidation.
            Vary:
              schema:
                type: string
              description: Cookie
            X-Content-Type-Options:
              schema:
                type: string
              description: nosniff
        '404':
          description: Missing/inaccessible/unpublished book, version or asset
        '503':
          description: Local artifact unavailable or integrity mismatch
        default:
          $ref: '#/components/responses/Problem'
    head:
      operationId: getReaderEpubHead
      summary: Read authorized asset headers without body
      parameters:
      - name: book
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: version
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
