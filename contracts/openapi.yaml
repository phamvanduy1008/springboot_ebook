      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: title
        in: query
        schema:
          type: string
          maxLength: 300
          default: EPUB ri?ng t?
      - name: author
        in: query
        schema:
          type: string
          maxLength: 500
          default: Ch?a x?c ??nh
      requestBody:
        required: true
        content:
          application/epub+zip:
            schema:
              type: string
              format: binary
      responses:
        '202':
          description: PROCESSING version and queued job; Cache-Control no-store
          headers:
            Location:
              schema:
                type: string
              description: Job status endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpubAccepted'
        '400':
          description: Invalid input/idempotency key
        '401':
          description: Session required
        '403':
          description: CSRF, administrator or verified email required
        '404':
          description: Missing/inaccessible book
        '409':
          description: Revision or idempotency conflict
        '413':
          description: Upload exceeds 64 MiB
        '422':
          description: Unsupported ZIP/EPUB signature
        '429':
          description: Storage quota or processing limit exceeded
        '503':
          description: Private storage unavailable
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/jobs/{id}:
    get:
      operationId: getJob
      security:
      - SessionCookie: []
      summary: Read a job owned by the session user or a public administrator job
      description: Private jobs never receive an administrator override. Payloads,
        storage keys and lease tokens are not returned. Responses use Cache-Control
        no-store.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Redacted job state
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - type
                - status
                - attempts
                - maxAttempts
                - updatedAt
                properties:
                  id:
                    type: string
                    format: uuid
                  bookId:
                    type: string
                    format: uuid
                  versionId:
                    type: string
                    format: uuid
                  type:
                    type: string
                    enum:
                    - INGEST
                    - TTS
                    - CLEANUP
                  status:
                    type: string
                    enum:
                    - QUEUED
                    - RUNNING
                    - SUCCEEDED
                    - FAILED
                    - CANCELLED
                  attempts:
                    type: integer
                    minimum: 0
                  maxAttempts:
                    type: integer
                    minimum: 1
                  errorCode:
                    type: string
                    nullable: true
                  updatedAt:
                    type: string
                    format: date-time
        '401':
          description: Session required
        '404':
          description: Missing or inaccessible job
