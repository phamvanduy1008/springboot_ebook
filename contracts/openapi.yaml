openapi: 3.1.0
info:
  title: EPUB API foundation
  version: 0.1.0
  description: Implemented health, authentication and account-security endpoints. Catalog is not implemented.
servers:
  - url: /
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Aggregate application health without component details
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Application is healthy
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: An application health contributor is unhealthy
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/account:
    get:
      operationId: getAccount
      security: [{SessionCookie: []}]
      responses:
        '200':
          description: Active account profile and login methods without credentials or provider subjects
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateAccount
      security: [{SessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                displayName: {type: string, minLength: 1, maxLength: 60}
                bio: {type: string, maxLength: 240}
      responses:
        '200':
          description: Updated profile; email/role/verified/provider fields are read only
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/account/change-password:
    post:
      operationId: changePassword
      security: [{SessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: {type: string, format: password, maxLength: 72, writeOnly: true}
                newPassword: {type: string, format: password, minLength: 12, maxLength: 72, writeOnly: true}
      responses:
        '200':
          description: Password changed, all old sessions revoked and a new current session established; refresh CSRF
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/account/sessions:
    get:
      operationId: listAccountSessions
      security: [{SessionCookie: []}]
      responses:
        '200':
          description: Up to 100 most recently active owned sessions; IDs are revocation identifiers, never cookie/session secrets
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: {$ref: '#/components/schemas/AccountSession'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/account/sessions/{id}:
    delete:
      operationId: revokeAccountSession
      security: [{SessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204':
          description: Owned session revoked; revoking the current session also clears its cookie
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/account/google/link:
    post:
      operationId: beginGoogleLink
      security: [{SessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword]
              properties:
                currentPassword: {type: string, format: password, maxLength: 72, writeOnly: true}
      responses:
        '200':
          description: Recent password reauthentication accepted; navigate to the returned relative URL to link Google to this user
          content:
            application/json:
              schema:
                type: object
                required: [authorizationUrl]
                properties:
                  authorizationUrl: {type: string}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailInput'
      responses:
        '202':
          $ref: '#/components/responses/EmailAccepted'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: {type: string, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true}
                password: {type: string, format: password, minLength: 12, maxLength: 72, writeOnly: true}
      responses:
        '204':
          description: Password replaced; all application sessions for the account revoked
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/register:
    post:
      operationId: register
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, displayName, password]
              properties:
                email: {type: string, format: email, maxLength: 320}
                displayName: {type: string, minLength: 1, maxLength: 60}
                password: {type: string, format: password, minLength: 12, maxLength: 72, writeOnly: true}
      responses:
        '202':
          $ref: '#/components/responses/EmailAccepted'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/resend-verification:
    post:
      operationId: resendVerification
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailInput'
      responses:
        '202':
          $ref: '#/components/responses/EmailAccepted'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenInput'
      responses:
        '204':
          description: Email verified by an unexpired single-use purpose-bound token
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/capabilities:
    get:
      operationId: getAuthCapabilities
      responses:
        '200':
          description: Enabled authentication methods; never includes client credentials
          content:
            application/json:
              schema:
                type: object
                required: [password, google]
                properties:
                  password: {type: boolean}
                  google: {type: boolean}
  /api/v1/oauth2/authorization/google:
    get:
      operationId: beginGoogleLogin
      summary: Navigate the browser here; Google login must be enabled
      parameters:
        - name: returnTo
          in: query
          schema: {type: string, maxLength: 512}
          description: Internal path only; unsafe values fall back to the site root
      responses:
        '302':
          description: Redirect to Google with session-bound state, nonce and PKCE challenge
          headers:
            Location:
              schema: {type: string, format: uri}
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/login/oauth2/code/google:
    get:
      operationId: googleLoginCallback
      summary: OIDC protocol callback; not a frontend JSON API
      parameters:
        - name: code
          in: query
          schema: {type: string}
        - name: state
          in: query
          schema: {type: string}
        - name: error
          in: query
          schema: {type: string}
      responses:
        '302':
          description: Redirect to configured frontend after validated login, or login page with allowlisted generic failure code
          headers:
            Location:
              schema: {type: string, format: uri}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/csrf:
    get:
      operationId: getCsrf
      summary: Bootstrap or refresh the anonymous/authenticated session CSRF token
      responses:
        '200':
          description: No-store CSRF token; bootstrap sets an HttpOnly session cookie
          content:
            application/json:
              schema:
                type: object
                required: [headerName, token]
                properties:
                  headerName: {type: string}
                  token: {type: string}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Authenticate with email/password; rotate session and refresh CSRF afterward
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email, maxLength: 320}
                password: {type: string, format: password, maxLength: 72, writeOnly: true}
      responses:
        '200':
          description: Logged in; HttpOnly SameSite=Lax session cookie, Secure in production
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      security: [{SessionCookie: []}]
      responses:
        '200':
          description: Current active account, without credentials or session secrets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/logout:
    post:
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '204':
          description: Session invalidated and cookie expired; refresh CSRF before next login
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
  parameters:
    Csrf:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: Token from GET /api/v1/auth/csrf, tied to the session cookie
      schema: {type: string}
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Safe ASCII ID up to 64 characters; invalid values are replaced by a UUID.
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      description: 'field,asc or field,desc. Endpoint-specific allowlist; id,asc is appended as tie-breaker. Reserved for future list endpoints.'
      schema:
        type: string
        default: id,asc
  headers:
    RequestId:
      description: Effective request identifier, also returned in problem bodies.
      schema:
        type: string
        maxLength: 64
  responses:
    EmailAccepted:
      description: Neutral response independent of whether the account/email is eligible
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: {type: string}
    Problem:
      description: Consistent error response without stack traces or rejected input values
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Account:
      type: object
      required: [id, email, displayName, bio, role, emailVerified, hasPassword, providers]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        email: {type: string, format: email, readOnly: true}
        displayName: {type: string, maxLength: 60}
        bio: {type: string, maxLength: 240}
        role: {type: string, enum: [USER, ADMIN], readOnly: true}
        emailVerified: {type: boolean, readOnly: true}
        hasPassword: {type: boolean, readOnly: true}
        providers:
          type: array
          readOnly: true
          items: {type: string, enum: [PASSWORD, GOOGLE]}
    AccountSession:
      type: object
      required: [id, createdAt, lastAccessAt, current]
      properties:
        id: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        lastAccessAt: {type: string, format: date-time}
        current: {type: boolean}
    EmailInput:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email, maxLength: 320}
    TokenInput:
      type: object
      required: [token]
      properties:
        token: {type: string, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true}
    Me:
      type: object
      required: [id, email, displayName, role, emailVerified]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        displayName: {type: string, maxLength: 60}
        role: {type: string, enum: [USER, ADMIN]}
        emailVerified: {type: boolean}
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, detail, requestId, fieldErrors]
      properties:
        type:
          type: string
          const: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        detail:
          type: string
        requestId:
          type: string
          maxLength: 64
        fieldErrors:
          type: object
          additionalProperties:
            type: string
    Page:
      description: Reusable envelope for future list endpoints; items are mapped DTOs, never entities.
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
