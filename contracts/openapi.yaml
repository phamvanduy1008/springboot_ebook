  /api/v1/books/{book}/versions/{version}/chapters/{chapter}:
    get:
      operationId: getReaderChapter
      summary: Read one sanitized TOC section without opening the source archive
      description: Same publication and private-owner authorization as the manifest.
        Sections end at the next distinct fragment in the same spine resource. No-store
        JSON; display HTML in a sandboxed frame and resolve local resources against
        baseUrl.
      parameters:
      - name: book
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: version
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: chapter
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Authorized chapter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderChapter'
        '404':
          description: Book/version/chapter not available
        '503':
          description: Immutable reader artifact unavailable or damaged
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
  parameters:
    Csrf:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: Token from GET /api/v1/auth/csrf, tied to the session cookie
      schema:
        type: string
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Safe ASCII ID up to 64 characters; invalid values are replaced
        by a UUID.
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      description: field,asc or field,desc. Endpoint-specific allowlist; id,asc is
        appended as tie-breaker. Reserved for future list endpoints.
      schema:
        type: string
        default: id,asc
  headers:
    RequestId:
      description: Effective request identifier, also returned in problem bodies.
      schema:
        type: string
        maxLength: 64
  responses:
    EmailAccepted:
      description: Neutral response independent of whether the account/email is eligible
      content:
        application/json:
          schema:
            type: object
            required:
            - message
            properties:
              message:
                type: string
    Problem:
      description: Consistent error response without stack traces or rejected input
        values
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ReaderAsset:
      type: object
      required:
      - id
      - href
      - url
      - mediaType
      - sizeBytes
      - sha256
      properties:
        id:
          type: string
          format: uuid
        href:
          type: string
        url:
          type: string
        mediaType:
          type: string
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
    ReaderSpine:
      type: object
      required:
      - id
      - index
      - href
      - resourceUrl
      - linear
      - rawUtf16Length
      properties:
        id:
          type: string
          format: uuid
        index:
          type: integer
          minimum: 0
        title:
          oneOf:
          - type: string
          - type: 'null'
        href:
          type: string
        resourceUrl:
          type: string
        linear:
          type: boolean
        rawUtf16Length:
          type: integer
          minimum: 0
          description: Canonical raw text length in UTF-16 code units, independent
            of TTS normalization.
    ReaderToc:
      type: object
