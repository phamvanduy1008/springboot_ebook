            Cache-Control:
              schema:
                type: string
              description: Private responses use private, no-store; public responses
                require revalidation.
            Vary:
              schema:
                type: string
              description: Cookie
            X-Content-Type-Options:
              schema:
                type: string
              description: nosniff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderManifest'
        '304':
          description: Not modified after current authorization is rechecked
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: Private responses use private, no-store; public responses
                require revalidation.
            Vary:
              schema:
                type: string
              description: Cookie
            X-Content-Type-Options:
              schema:
                type: string
              description: nosniff
