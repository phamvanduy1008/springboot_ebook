app.database-url=${DB_URL:}
app.database-username=${DB_USERNAME:}
app.database-password=${DB_PASSWORD:}
app.smtp-host=${SMTP_HOST:127.0.0.1}
app.smtp-port=${SMTP_PORT:1025}
spring.mail.host=${app.smtp-host}
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}
spring.mail.port=${app.smtp-port}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=10000
spring.mail.properties[mail.smtp.writetimeout]=10000
spring.mail.properties[mail.debug]=false
spring.mail.properties[mail.smtp.auth]=${SMTP_AUTH:false}
spring.mail.properties[mail.smtp.starttls.enable]=${SMTP_STARTTLS:false}
spring.mail.properties[mail.smtp.starttls.required]=${SMTP_STARTTLS:false}
app.mail.from=${MAIL_FROM:noreply@example.test}
app.storage-root=${STORAGE_ROOT:./var/storage}
app.epub.private-quota-bytes=${EPUB_PRIVATE_QUOTA_BYTES:1073741824}
app.epub.admin-quota-bytes=${EPUB_ADMIN_QUOTA_BYTES:107374182400}
app.epub.ingest-enabled=${EPUB_INGEST_ENABLED:true}
app.public-origin=${APP_PUBLIC_ORIGIN:http://localhost:5173}
app.frontend.hash-routing=${FRONTEND_HASH_ROUTING:true}
logging.pattern.level=%5p [requestId=%X{requestId:-}]
spring.mvc.log-request-details=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
app.persistence.enabled=true
app.google.enabled=${GOOGLE_LOGIN_ENABLED:false}
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:}
logging.level.org.springframework.security.oauth2=WARN
app.local-seed.enabled=${APP_LOCAL_SEED_ENABLED:false}
app.local-admin-seed.enabled=${APP_LOCAL_ADMIN_SEED_ENABLED:false}
spring.datasource.url=${app.database-url}
spring.datasource.username=${app.database-username}
spring.datasource.password=${app.database-password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.sql.init.mode=never
spring.session.jdbc.initialize-schema=never
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF
